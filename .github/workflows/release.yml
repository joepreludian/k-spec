# A version tag (v<major>.<minor>.<patch>) publishes the image to Docker Hub, for amd64 and
# arm64, after the same checks every change gets. Nothing else publishes.
#
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token that
# may write to the repository below).
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  # The one place the published image is named.
  IMAGE: docker.io/joepreludian/k-spec

jobs:
  version:
    name: The tag is the version in package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version. Tag v$version, or change the version first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the image
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build for both platforms and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Projects set up from this image are pinned to exactly this version.
          build-args: K_SPEC_IMAGE=${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
